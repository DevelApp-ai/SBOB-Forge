name: callee-repair

# One-shot repair lane: rebuilds .github/workflows/sbob-registry-publish.yml
# byte-clean from the pre-#39 base (f004b54a) plus the put() update-path fix,
# and pushes it to fix/registry-put-existing-sha-3. The #39 merge (f686793c)
# landed with long lines wrapped mid-token (invalid YAML) - this rebuilds from
# the clean base. Self-validates the result md5 before pushing.

on:
  push:
    branches: [repair/callee]

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Rebuild the fixed reusable workflow and push it
        shell: bash
        env:
          EXPECTED_MD5: d3f60c6533c7cf706b7dc3bcb048024d
        run: |
          set -euo pipefail
          base="https://raw.githubusercontent.com/DevelApp-ai/SBOB-Forge/f004b54a876618fa8684d27d9ff6302f298419c2/.github/workflows/sbob-registry-publish.yml"
          curl -sfL "$base" -o wf.yml
          [ "$(wc -c < wf.yml)" -gt 19000 ] || { echo "base fetch bad"; exit 1; }
          echo '' | base64 -d > /tmp/old.txt
          echo '' | base64 -d > /tmp/new.txt
          python3 - <<'PYEOF'
          old = open('/tmp/old.txt').read()
          new = open('/tmp/new.txt').read()
          p = open('wf.yml').read()
          assert p.count(old) == 1, "old block not found exactly once in base"
          open('wf.yml', 'w').write(p.replace(old, new))
          PYEOF
          got="$(md5sum wf.yml | cut -d' ' -f1)"
          [ "$got" = "$EXPECTED_MD5" ] || { echo "md5 mismatch: $got != $EXPECTED_MD5"; exit 1; }
          grep -q 'existing_sha=' wf.yml
          git clone -q --depth 1 --branch repair/callee "https://x-access-token:${{ github.token }}@github.com/DevelApp-ai/SBOB-Forge.git" repo
          cd repo
          cp ../wf.yml .github/workflows/sbob-registry-publish.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "sbob-registry-publish: byte-clean rebuild of the update-path fix (repair of f686793c line-wrap damage)"
          git push -q "https://x-access-token:${{ github.token }}@github.com/DevelApp-ai/SBOB-Forge.git" HEAD:refs/heads/fix/registry-put-existing-sha-3
          echo "pushed fix/registry-put-existing-sha-3"
