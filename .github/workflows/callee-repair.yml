name: callee-repair

# One-shot repair lane (round 2): rebuilds sbob-registry-publish.yml
# byte-clean from the pre-#39 base (f004b54a) plus the put() update-path fix
# (delivered as repair-new.txt on this branch), and pushes a fix branch based
# on the clean base. The #39 merge (f686793c) landed with long lines wrapped
# mid-token (invalid YAML). Self-validates the result md5 before pushing.

on:
  push:
    branches: [repair/callee]
    paths: [.github/workflows/callee-repair.yml]

permissions:
  contents: write
  workflows: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Rebuild the fixed reusable workflow and push it
        shell: bash
        env:
          EXPECTED_MD5: d3f60c6533c7cf706b7dc3bcb048024d
        run: |
          set -euo pipefail
          base="https://raw.githubusercontent.com/DevelApp-ai/SBOB-Forge/f004b54a876618fa8684d27d9ff6302f298419c2/.github/workflows/sbob-registry-publish.yml"
          curl -sfL "$base" -o wf.yml
          [ "$(wc -c < wf.yml)" -gt 19000 ] || { echo "base fetch bad"; exit 1; }
          [ "$(wc -c < repair-new.txt)" -eq 1232 ] || { echo "repair-new.txt wrong size"; exit 1; }
          awk '/^          b64\(\) \{ base64 -w0 "\$1"; \}$/{f=1} f{print} f && /^          \}$/{exit}' wf.yml > /tmp/old.txt
          [ "$(wc -c < /tmp/old.txt)" -eq 226 ] || { echo "old block extraction wrong size"; exit 1; }
          python3 - <<'PYEOF'
          old = open('/tmp/old.txt').read()
          new = open('repair-new.txt').read()
          p = open('wf.yml').read()
          assert p.count(old) == 1, "old block not found exactly once in base"
          open('wf.yml', 'w').write(p.replace(old, new))
          PYEOF
          got="$(md5sum wf.yml | cut -d' ' -f1)"
          [ "$got" = "$EXPECTED_MD5" ] || { echo "md5 mismatch: $got != $EXPECTED_MD5"; exit 1; }
          grep -q 'existing_sha=' wf.yml
          git fetch -q --depth 1 origin f004b54a876618fa8684d27d9ff6302f298419c2
          git checkout -q FETCH_HEAD
          cp wf.yml .github/workflows/sbob-registry-publish.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/sbob-registry-publish.yml
          git commit -qm "sbob-registry-publish: supply the blob sha when the registry file already exists (update path)"
          git push -q "https://x-access-token:${{ github.token }}@github.com/DevelApp-ai/SBOB-Forge.git" HEAD:refs/heads/fix/registry-put-existing-sha-3
          echo "pushed fix/registry-put-existing-sha-3"
