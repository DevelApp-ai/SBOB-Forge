name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore

      - name: Build (warnings as errors)
        run: dotnet build --no-restore -warnaserror

      - name: Test
        run: dotnet test --no-build --logger "trx"

      # Org decision #26: generated artifacts are committed and drift-gated.
      # Every fixture SBOB must regenerate byte-identically from the pinned lock.
      - name: Drift gate (all fixtures --check --frozen)
        run: |
          for fixture in dotnet-xunit java-junit5 java-testng python-pytest python-unittest go-testing js-jest ts-vitest; do
            dotnet run --no-build --project src/SBOBForge.Cli -- generate "examples/$fixture-fixture" --check --frozen
          done
