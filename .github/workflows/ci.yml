name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test-drift:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      packages: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: SDK info
        run: dotnet --info | tee sdkinfo.log

      - name: Restore
        shell: bash
        env:
          # Org decision #8: GitHub Packages reads authenticate with the org
          # secret, falling back to GITHUB_TOKEN (packages: read).
          NUGET_AUTH_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN || github.token }}
        run: |
          set -o pipefail
          dotnet restore 2>&1 | tee restore.log

      - name: Build (warnings as errors)
        shell: bash
        run: |
          set -o pipefail
          dotnet build --no-restore -warnaserror 2>&1 | tee build.log

      - name: Test
        shell: bash
        run: |
          set -o pipefail
          dotnet test --no-build --logger "trx" 2>&1 | tee test.log

      # Org decision #26: generated artifacts are committed and drift-gated.
      # Every fixture SBOB must regenerate byte-identically from the pinned lock.
      - name: Drift gate (all fixtures --check --frozen)
        shell: bash
        run: |
          set -o pipefail
          for fixture in dotnet-xunit java-junit5 java-testng python-pytest python-unittest go-testing js-jest ts-vitest php-phpunit powershell-pester bash-bats c-googletest cpp-catch2; do
            dotnet run --no-build --project src/SBOBForge.Cli -- generate "examples/$fixture-fixture" --check --frozen 2>&1 | tee -a drift.log
          done

      # On failure, post the captured step logs to the PR so the failure cause is
      # visible without downloading the run archive (agent workflow, org decision #29).
      - name: Report failure context to PR
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const chunks = [];
            for (const f of ['sdkinfo.log', 'restore.log', 'build.log', 'test.log', 'drift.log']) {
              try {
                const t = fs.readFileSync(f, 'utf8').trimEnd();
                if (t.length === 0) continue;
                chunks.push('### ' + f + '\n```\n' + (t.length > 14000 ? '...[tail]\n' + t.slice(-14000) : t) + '\n```');
              } catch {}
            }
            const body = chunks.join('\n\n') || 'no logs captured';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: 'CI failure context (run ' + context.runId + '):\n\n' + body
            });

  # TDS 10.1.2 / 14.5: transpiler replay lane. Every committed fixture golden
  # is converted to the Software-Bill-of-Behavior registry dialect
  # (sbobforge convert, TDS 10.4) and must pass that repo's sbobctl validate
  # (parse + schema + lint) at a pinned SHA. A lint rejection routes here,
  # not downstream. Node >= 22 per org decision #20; the pinned SHA makes
  # spec/tool changes explicit PRs (TDS 16 risk table).
  transpiler-replay:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      SBOB_REPO_SHA: 181783453d3e9bddc30faba5f0b9ad96a571b2d9
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Checkout Software-Bill-of-Behavior at the pinned SHA
        uses: actions/checkout@v5
        with:
          repository: DevelApp-ai/Software-Bill-of-Behavior
          ref: ${{ env.SBOB_REPO_SHA }}
          path: sbob-repo

      - name: Restore
        shell: bash
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN || github.token }}
        run: |
          set -o pipefail
          dotnet restore 2>&1 | tee replay-restore.log

      - name: Build (warnings as errors)
        shell: bash
        run: |
          set -o pipefail
          dotnet build --no-restore -warnaserror 2>&1 | tee replay-build.log

      - name: Convert + sbobctl validate every fixture golden
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/sbob-replay
          fail=0
          for golden in examples/*/sbob/*.sbob.yaml; do
            name="$(basename "$golden" .sbob.yaml)"
            out="/tmp/sbob-replay/$name.yaml"
            dotnet run --no-build --project src/SBOBForge.Cli -- convert "$golden" "$out"
            echo "::group::replay: sbobctl validate $name"
            if ! node sbob-repo/src/cli.ts validate --sbob "$out"; then
              fail=1
            fi
            echo "::endgroup::"
          done
          exit $fail
