name: sbob-registry-publish

# M6 pipeline (TDS 10.2, 10.3, 10.5, 12): cosign signing + registry publish for a
# package-bound SBoB. Called from a product repo's release/main workflow:
#
#   jobs:
#     sbob-publish:
#       uses: DevelApp-ai/SBOB-Forge/.github/workflows/sbob-registry-publish.yml@<pinned-ref>
#       with:
#         package-purl: pkg:nuget/develapp.minotaur@1.5.25
#         sbob-file: sbob/develapp-minotaur.linux.sbob.yaml
#         registry-dir: sbobs/nuget
#         registry-repo: DevelApp-ai/SBOB-Registry                # default: PUBLIC registry (org decision #40)
#         # private/internal product instead:
#         #   registry-repo: DevelApp-ai/DevelApp-Repo-Global    # PRIVATE registry, lane: private,
#         #   secrets: SBOB_REGISTRY_TOKEN: ${{ secrets.SBOB_PRIVATE_REGISTRY_TOKEN }}
#         lane: public                                           # public runs the content gate; private skips it
#       permissions:
#         contents: read
#         packages: read    # substrate restore via the #8 fallback token
#         id-token: write        # cosign keyless OIDC (org decision #14)
#       secrets:
#         SBOB_REGISTRY_TOKEN: ${{ secrets.SBOB_REGISTRY_TOKEN }} # contents:write on the registry-repo you target
#         PACKAGES_READ_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN }} # org secret #8 — forward it, or the substrate restore falls back to github.token
#
# Stages:
#   1. drift gate — sbobforge generate --check --frozen (org decision #26):
#      a drifted profile is never signed or published; fix by regenerating.
#   2. cosign keyless (OIDC) signing of the SBoB + provenance sidecar with the
#      repo workflow identity (org decision #14): <file>.sig + <file>.bundle,
#      the artifact names sbobctl's CosignVerifier expects.
#   3. dialect conversion to the registry dialect (TDS 10.4).
#   4. public-lane content gate (TDS 10.5, lane: public only) — sbobforge gate:
#      private DNS suffixes, internal (non-loopback) IP ranges, or bare
#      single-label hostnames fail the publish BEFORE the registry PR is opened.
#      The private lane (lane: private) skips this gate: same pipeline, same
#      gates otherwise, only the audience changes.
#   5. sbobctl validate + diff vs the previous released registry file, with
#      the tooling checked out from the pinned tooling-repo SHA — the sbob-diff-gate ladder (fail-on mandatory);
#      the verdict routes into the registry PR.
#   6. registry PR adding/updating sbobs/<dir>/<name>.yaml (+ .sig/.bundle)
#      in the target registry repo (squash-merged, org #28).
#      The pipeline opens the PR; it never merges it. The PR base and the
#      previous-release ref are the registry repo DEFAULT BRANCH (resolved at
#      runtime: main on SBOB-Registry, master on DevelApp-Repo-Global), and
#      an empty forwarded registry token fails closed before any signing.
#
# Registry layout (org decision #40): the PUBLIC registry is
# DevelApp-ai/SBOB-Registry (org secret SBOB_REGISTRY_TOKEN); the PRIVATE /
# internal registry is DevelApp-ai/DevelApp-Repo-Global (org secret
# SBOB_PRIVATE_REGISTRY_TOKEN). The token passed in must carry
# contents:write on exactly the registry-repo targeted (a cross-repo PR —
# the calling repo's github.token can never open it; no fallback, by
# design). The sbobctl tooling (validate/diff) is checked out from the
# pinned tooling-repo (Software-Bill-of-Behavior) independently of the
# registry target.

on:
  workflow_call:
    inputs:
      package-purl:
        description: 'Version-pinned package purl the profile is bound to (must equal spec.imageID)'
        required: true
        type: string
      sbob-file:
        description: 'Committed kubescape-dialect profile path (relative to the product repo root)'
        required: true
        type: string
      provenance-file:
        description: 'Provenance sidecar (JSONL) path; default derived from the sbob-file name'
        required: false
        type: string
      registry-dir:
        description: 'Registry lane directory: sbobs/nuget or sbobs/choco'
        required: false
        default: 'sbobs/nuget'
        type: string
      registry-name:
        description: 'Registry file base name; default derived from the sbob-file basename'
        required: false
        type: string
      registry-repo:
        description: 'Registry repository (owner/repo) receiving the published profile (org decision #40: SBOB-Registry public, DevelApp-Repo-Global private/internal)'
        required: false
        default: 'DevelApp-ai/SBOB-Registry'
        type: string
      tooling-repo:
        description: 'sbobctl tooling repository (owner/repo): validate/diff tooling is checked out from here, SHA-pinned'
        required: false
        default: 'DevelApp-ai/Software-Bill-of-Behavior'
        type: string
      tooling-repo-sha:
        description: 'Pinned SHA of the sbobctl tooling repo (tooling-repo) to check the validate/diff tooling from'
        required: false
        default: '181783453d3e9bddc30faba5f0b9ad96a571b2d9'
        type: string
      lane:
        description: 'Visibility lane: public (content gate enforced) or private (content gate skipped)'
        required: false
        default: 'public'
        type: string
      content-gate-allow:
        description: 'Optional comma-separated --allow list for the public-lane content gate (exact host/suffix/ip)'
        required: false
        default: ''
        type: string
      fail-on:
        description: 'Diff-gate verdict at which publishing stops: none | advisory | mandatory'
        required: false
        default: 'mandatory'
        type: string
      sbob-forge-ref:
        description: 'SBOB-Forge ref to build the sbobforge CLI from; default: the ref this workflow is called with'
        required: false
        default: ''
        type: string
      sbob-config:
        description: 'sbobforge config the profile is generated from (repo-relative path); the drift gate runs against it'
        required: false
        default: 'sbobforge.json'
        type: string
    secrets:
      SBOB_REGISTRY_TOKEN:
        description: 'Token with contents:write on the registry repo named by registry-repo (opens the registry PR)'
        required: true
      PACKAGES_READ_TOKEN:
        description: 'GitHub Packages read token for the sbobforge substrate restore (org decision #8); optional — when not forwarded the restore falls back to github.token'
        required: false

env:
  # Registry PR target (org decision #40). The token must carry
  # contents:write on exactly this repo — no github.token fallback.
  REGISTRY_REPO: ${{ inputs.registry-repo }}
  # sbobctl tooling (validate/diff) is checked out from the pinned tooling
  # repo — same pin as the ci.yml replay lane; spec/tool changes are
  # explicit PRs (TDS 16 risk table).
  TOOLING_REPO: ${{ inputs.tooling-repo }}
  TOOLING_REPO_SHA: ${{ inputs.tooling-repo-sha }}
  LANE: ${{ inputs.lane }}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # GitHub Packages restore of the sbobforge substrate (org decision #8).
      # A called workflow can keep or REDUCE the caller's GITHUB_TOKEN
      # permissions, never raise them: with only contents/id-token here the
      # caller's packages: read grant was dropped, so the github.token
      # fallback 403'd (NU1301) on every 2026-11-03 dispatch. Keep this scope
      # in sync with the calling jobs' permissions blocks.
      packages: read
      id-token: write   # cosign keyless OIDC (org decision #14)
    steps:
      # The default checkout in a reusable workflow is the CALLING (product) repo.
      - uses: actions/checkout@v5

      - name: Resolve the SBOB-Forge ref to build from
        id: forge-ref
        shell: bash
        run: |
          set -euo pipefail
          ref="${{ inputs.sbob-forge-ref }}"
          if [ -z "$ref" ]; then
            # github.workflow_ref = <org>/<repo>/.github/workflows/<file>.yml@<ref>
            ref="${GITHUB_WORKFLOW_REF##*@}"
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Checkout SBOB-Forge (generator)
        uses: actions/checkout@v5
        with:
          repository: DevelApp-ai/SBOB-Forge
          ref: ${{ steps.forge-ref.outputs.ref }}
          path: sbobforge-repo

      - name: Checkout the sbobctl tooling repo at the pinned SHA (validate + diff gate)
        uses: actions/checkout@v5
        with:
          repository: ${{ env.TOOLING_REPO }}
          ref: ${{ env.TOOLING_REPO_SHA }}
          path: sbob-repo

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Resolve derived paths
        id: paths
        shell: bash
        run: |
          set -euo pipefail
          sbob_file="${{ inputs.sbob-file }}"
          base="$(basename "$sbob_file" .sbob.yaml)"
          name="${{ inputs.registry-name }}"
          [ -n "$name" ] || name="$base"
          prov="${{ inputs.provenance-file }}"
          [ -n "$prov" ] || prov="$(dirname "$sbob_file")/$base.provenance.jsonl"
          echo "sbob-file=$sbob_file" >> "$GITHUB_OUTPUT"
          echo "provenance-file=$prov" >> "$GITHUB_OUTPUT"
          echo "registry-name=$name" >> "$GITHUB_OUTPUT"
          echo "registry-file=${{ inputs.registry-dir }}/$name.yaml" >> "$GITHUB_OUTPUT"

      - name: Fail closed on a missing registry token
        shell: bash
        env:
          GH_REGISTRY_TOKEN: ${{ secrets.SBOB_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          # Fail closed, up front: the 2026-11-03 v1.5.27 dispatch reached
          # the registry PR step with an EMPTY forwarded token — gh exited 4
          # ("set the GH_TOKEN environment variable"), and the validate step
          # gh api fallback had silently reported "no previous release",
          # SKIPPING the sbobctl diff gate. Refuse to publish instead of
          # degrading: the caller must forward a visible registry token (org
          # decision #40 — org secret visible to the CALLING repo). No
          # github.token fallback, by design (the registry PR is cross-repo;
          # the calling repo token can never open it).
          if [ -z "$GH_REGISTRY_TOKEN" ]; then
            echo "SBOB_REGISTRY_TOKEN is empty — no visible registry token was forwarded."
            exit 2
          fi
      - name: Resolve the registry default branch
        id: reg-base
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.SBOB_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          # Never hardcode the default branch: the public registry
          # (SBOB-Registry) uses main; the private registry
          # (DevelApp-Repo-Global, org decision #40) uses master. Resolve it
          # once here — the previous-release fetch and the registry PR base
          # below both use this output.
          base="$(gh api "repos/${{ env.REGISTRY_REPO }}" --jq .default_branch)"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "registry default branch: $base"
      - name: Restore + build sbobforge
        working-directory: sbobforge-repo
        shell: bash
        env:
          # Org decision #8 fallback. In a reusable workflow the caller's
          # PACKAGES_READ_TOKEN is only visible when the caller forwards it
          # via its secrets: mapping — otherwise this expression silently
          # falls to github.token, which needs both packages: read in this
          # job's permissions and the calling repo granted access to the
          # package. Callers that have the org secret should forward it.
          NUGET_AUTH_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN || github.token }}
        run: |
          set -euo pipefail
          dotnet restore
          dotnet build --no-restore -warnaserror

      - name: Drift gate (never sign or publish a drifted profile)
        shell: bash
        run: |
          set -euo pipefail
          dotnet run --no-build --project sbobforge-repo/src/SBOBForge.Cli -- \
            generate . --check --frozen --config "${{ inputs.sbob-config }}"
          # The committed profile must be bound to the requested purl.
          dotnet run --no-build --project sbobforge-repo/src/SBOBForge.Cli -- \
            validate "${{ steps.paths.outputs.sbob-file }}"
          grep -q "imageID: ${{ inputs.package-purl }}" "${{ steps.paths.outputs.sbob-file }}" \
            || { echo "spec.imageID does not match package-purl input '${{ inputs.package-purl }}'"; exit 2; }

      - name: Sign SBoB + provenance (cosign keyless OIDC)
        uses: sigstore/cosign-installer@v3

      - name: cosign sign-blob (SBoB + provenance sidecar)
        shell: bash
        env:
          SBOB_FILE: ${{ steps.paths.outputs.sbob-file }}
          PROV_FILE: ${{ steps.paths.outputs.provenance-file }}
        run: |
          set -euo pipefail
          for f in "$SBOB_FILE" "$PROV_FILE"; do
            [ -f "$f" ] || { echo "missing signing input: $f"; exit 2; }
            cosign sign-blob --yes --output-signature "$f.sig" --bundle "$f.bundle" "$f"
            cosign verify-blob \
              --bundle "$f.bundle" \
              --certificate-identity-regexp '^https://github.com/DevelApp-ai/' \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              "$f"
          done

      - name: Convert to the registry dialect (TDS 10.4)
        shell: bash
        env:
          SBOB_FILE: ${{ steps.paths.outputs.sbob-file }}
          REGISTRY_FILE: ${{ steps.paths.outputs.registry-file }}
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$REGISTRY_FILE")"
          dotnet run --no-build --project sbobforge-repo/src/SBOBForge.Cli -- \
            convert "$SBOB_FILE" "$REGISTRY_FILE"
          # The registry copy carries the same signature artifacts so cosign
          # verify-blob works straight from the registry repo.
          cp "$SBOB_FILE.sig" "$REGISTRY_FILE.sig"
          cp "$SBOB_FILE.bundle" "$REGISTRY_FILE.bundle"

      - name: Public-lane content gate (TDS 10.5; skipped on the private lane)
        if: ${{ inputs.lane == 'public' }}
        shell: bash
        env:
          REGISTRY_FILE: ${{ steps.paths.outputs.registry-file }}
          ALLOW_INPUT: ${{ inputs.content-gate-allow }}
        run: |
          set -euo pipefail
          allow_args=()
          if [ -n "$ALLOW_INPUT" ]; then
            IFS=',' read -ra parts <<< "$ALLOW_INPUT"
            for p in "${parts[@]}"; do
              [ -n "$p" ] && allow_args+=(--allow "$p")
            done
          fi
          dotnet run --no-build --project sbobforge-repo/src/SBOBForge.Cli -- \
            gate "$REGISTRY_FILE" "${allow_args[@]}"

      - name: sbobctl validate + diff gate vs previous release
        shell: bash
        env:
          GH_REGISTRY_TOKEN: ${{ secrets.SBOB_REGISTRY_TOKEN }}
          REGISTRY_FILE: ${{ steps.paths.outputs.registry-file }}
          REGISTRY_NAME: ${{ steps.paths.outputs.registry-name }}
          FAIL_ON: ${{ inputs.fail-on }}
        run: |
          set -euo pipefail
          node sbob-repo/src/cli.ts validate --sbob "$REGISTRY_FILE"

          old="/tmp/previous-$REGISTRY_NAME.yaml"
          if gh api "repos/${{ env.REGISTRY_REPO }}/contents/$REGISTRY_FILE?ref=${{ steps.reg-base.outputs.base }}" \
               --header "Authorization: Bearer $GH_REGISTRY_TOKEN" \
               --jq .content | base64 -d > "$old" 2>/dev/null && [ -s "$old" ]; then
            echo "previous release found; running the sbob-diff-gate ladder (fail-on: $FAIL_ON)"
            node sbob-repo/src/cli.ts diff --old "$old" --new "$REGISTRY_FILE" --fail-on "$FAIL_ON"
          else
            echo "no previous release for $REGISTRY_NAME — diff gate trivially clean (first registry entry)"
          fi

      - name: Write the registry PR body
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/pr-body.md <<'EOF'
          Published by the SBOB-Forge sbob-registry-publish pipeline (TDS 10.2/10.3/10.5).

          - **Package:** `PACKAGE_PURL`
          - **Registry file:** `REGISTRY_FILE_PATH` (+ `.sig` / `.bundle` cosign artifacts)
          - **Lane:** `LANE`LANE_GATE_NOTE
          - **Generated by:** sbobforge, drift-gated `--check --frozen` before signing
          - **Diff gate:** the previous released profile was compared with the sbob-diff-gate ladder (fail-on: FAIL_ON) at pinned tooling-repo SHA `PINNED_SHA`

          **Verify the signature (cosign keyless, org decision #14):**

          ```bash
          cosign verify-blob \
            --bundle REGISTRY_FILE_PATH.bundle \
            --certificate-identity-regexp '^https://github.com/DevelApp-ai/' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            REGISTRY_FILE_PATH
          ```
          EOF
          if [ "${{ inputs.lane }}" = "public" ]; then
            gate_note=" — public-lane content gate passed (no internal infrastructure disclosure)"
          else
            gate_note=" — content gate skipped by design (private lane)"
          fi
          sed -i \
            -e "s|PACKAGE_PURL|${{ inputs.package-purl }}|g" \
            -e "s|REGISTRY_FILE_PATH|${{ steps.paths.outputs.registry-file }}|g" \
            -e "s|LANE_GATE_NOTE|$gate_note|g" \
            -e "s|LANE|${{ inputs.lane }}|g" \
            -e "s|FAIL_ON|${{ inputs.fail-on }}|g" \
            -e "s|PINNED_SHA|${{ env.TOOLING_REPO_SHA }}|g" \
            /tmp/pr-body.md

      - name: Open the registry PR
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.SBOB_REGISTRY_TOKEN }}
          PURL: ${{ inputs.package-purl }}
        run: |
          set -euo pipefail
          reg_name="${{ steps.paths.outputs.registry-name }}"
          registry_file="${{ steps.paths.outputs.registry-file }}"
          version="${PURL##*@}"
          branch="sbob-registry-$reg_name-$(git log -1 --format=%h)"

          gh api -X DELETE "repos/${{ env.REGISTRY_REPO }}/git/refs/heads/$branch" >/dev/null 2>&1 || true
          sha="$(gh api "repos/${{ env.REGISTRY_REPO }}/git/ref/heads/${{ steps.reg-base.outputs.base }}" --jq .object.sha)"
          gh api -X POST "repos/${{ env.REGISTRY_REPO }}/git/refs" \
            -f ref="refs/heads/$branch" -f sha="$sha" >/dev/null

          b64() { base64 -w0 "$1"; }
          put() {
            gh api -X PUT "repos/${{ env.REGISTRY_REPO }}/contents/$1" \
              -f message="$2" -f content="$(b64 "$3")" -f branch="$branch" >/dev/null
          }
          put "$registry_file" "sbob: $PURL" "$registry_file"
          put "$registry_file.sig" "sbob: cosign signature for $PURL" "$registry_file.sig"
          put "$registry_file.bundle" "sbob: cosign keyless bundle for $PURL" "$registry_file.bundle"

          gh pr create \
            --repo "${{ env.REGISTRY_REPO }}" \
            --base "${{ steps.reg-base.outputs.base }}" \
            --head "$branch" \
            --title "sbob(${{ inputs.registry-dir }}): $reg_name $version" \
            --body-file /tmp/pr-body.md
          echo "registry PR opened"
