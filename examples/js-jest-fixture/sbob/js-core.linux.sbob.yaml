apiVersion: spdx.softwarecomposition.kubescape.io/v1beta1
kind: ContainerProfile
metadata:
  name: js-core.linux
  namespace: develapp
  annotations:
    kubescape.io/managed-by: User
    develapp.io/binding: package-purl
    develapp.io/generator: sbobforge@0.1.0
    develapp.io/grammar-lock-sha256: a1aa645984c43b48b5f751727c61d728f60be5375490d77cea2850d714b09293
    develapp.io/behavior-hash: ce332a34b4ed5eb65ed3071b0c9c0bd8622fbb7c4c700c86782f08a8f9e59b64
spec:
  architectures: [amd64]
  imageID: pkg:npm/js-core@1.0.0
  execs:
    - path: /usr/bin/git
      args: [/usr/bin/git, status]
  opens:
    - path: "/app/⋯/cache/last.json"
      flags: [O_WRONLY, O_CREAT, O_TRUNC]
    - path: /etc/app/config.json
      flags: [O_RDONLY]
    - path: /var/log/app.log
      flags: [O_WRONLY, O_CREAT, O_APPEND]
    - path: /var/log/other.log
      flags: [O_WRONLY, O_CREAT, O_APPEND]
  ingress:
    - identifier: port-8080-ingress
      type: external
      ports:
        - { port: 8080, protocol: TCP }
  egress:
    - identifier: api.example.com-egress
      type: external
      dnsNames: [api.example.com]
      ports:
        - { port: 443, protocol: TCP }
