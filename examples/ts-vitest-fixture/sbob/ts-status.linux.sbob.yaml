apiVersion: spdx.softwarecomposition.kubescape.io/v1beta1
kind: ContainerProfile
metadata:
  name: ts-status.linux
  namespace: develapp
  annotations:
    kubescape.io/managed-by: User
    develapp.io/binding: package-purl
    develapp.io/generator: sbobforge@1.0.0
    develapp.io/grammar-lock-sha256: 8e5651bf16ecf80ab37c143263072547922c294ad593ca17fe68cdef116ffe57
    develapp.io/behavior-hash: 8c47e8dca85342087fcda8064b3bb5a5483409add27809f2a8ce4df6a2cd681d
spec:
  architectures: [amd64]
  imageID: pkg:npm/ts-status@1.0.0
  execs:
    - path: /bin/sh
      args: [/bin/sh, "-c", git status]
  opens:
    - path: /var/log/report.log
      flags: [O_WRONLY, O_CREAT, O_APPEND]
    - path: /var/log/ts-status.log
      flags: [O_WRONLY, O_CREAT, O_APPEND]
  ingress:
    - identifier: port-8080-ingress
      type: external
      ports:
        - { port: 8080, protocol: TCP }
  egress:
    - identifier: api.example.com-egress
      type: external
      dnsNames: [api.example.com]
      ports:
        - { port: 443, protocol: TCP }
