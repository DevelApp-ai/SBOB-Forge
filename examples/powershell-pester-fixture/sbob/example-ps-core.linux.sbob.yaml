apiVersion: spdx.softwarecomposition.kubescape.io/v1beta1
kind: ContainerProfile
metadata:
  name: example-ps-core.linux
  namespace: develapp
  annotations:
    kubescape.io/managed-by: User
    develapp.io/binding: package-purl
    develapp.io/generator: sbobforge@1.0.0
    develapp.io/grammar-lock-sha256: 8e5651bf16ecf80ab37c143263072547922c294ad593ca17fe68cdef116ffe57
    develapp.io/behavior-hash: 52fefb3c7bfeccfe8dd6ada092a72bc77bff5db5fd9b83299edf11041cea204e
spec:
  architectures: [amd64]
  imageID: pkg:nuget/example-ps-core@1.0.0
  execs:
    - path: /usr/bin/git
      args: [/usr/bin/git, status]
  opens:
    - path: "/app/⋯/cache/last.json"
      flags: [O_WRONLY, O_CREAT, O_TRUNC]
    - path: /etc/app/config.json
      flags: [O_RDONLY]
    - path: /var/log/ps-app.log
      flags: [O_WRONLY, O_CREAT, O_APPEND]
  egress:
    - identifier: api.example.com-egress
      type: external
      dnsNames: [api.example.com]
      ports:
        - { port: 443, protocol: TCP }
