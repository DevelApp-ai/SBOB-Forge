apiVersion: spdx.softwarecomposition.kubescape.io/v1beta1
kind: ContainerProfile
metadata:
  name: com-example-example-ng.linux
  namespace: develapp
  annotations:
    kubescape.io/managed-by: User
    develapp.io/binding: package-purl
    develapp.io/generator: sbobforge@0.1.0
    develapp.io/grammar-lock-sha256: 7539ee76abb3fe2eccc31fc742f538ceb7eb78f0282e00704589fa364a7b7b55
    develapp.io/behavior-hash: 0e72572481c87a667debd444d0e1e48dd64bcfaeca363ff53c278156e2a7e246
spec:
  architectures: [amd64]
  imageID: pkg:maven/com.example/example-ng@1.0.0
  execs:
    - path: /usr/bin/git
      args: [/usr/bin/git, status]
  opens:
    - path: /var/log/ng-app.log
      flags: [O_WRONLY, O_CREAT, O_APPEND]
    - path: /var/log/ng-app.log
      flags: [O_WRONLY, O_CREAT, O_TRUNC]
  egress:
    - identifier: api.example.com-egress
      type: external
      dnsNames: [api.example.com]
      ports:
        - { port: 443, protocol: TCP }
