name: 'sbobforge'
description: 'Tests → SBoB generator as a GitHub Action: derive a Software Bill of Behavior profile from a package''s committed test suite (version / scan / generate with drift gate / convert / gate — the sbobforge CLI). Source mode runs the CLI on .NET 8; binary mode (binary: true) downloads a single-file self-contained release binary instead — no .NET install, no packages token. For the full signed publish lane to a registry repo you own, call the repo''s reusable workflow sbob-registry-publish.yml (see docs/adoption.md).'
author: 'DevelApp-ai'

branding:
  icon: 'hammer'
  color: 'purple'

inputs:
  command:
    description: 'sbobforge command: version | scan | generate | convert | gate'
    required: false
    default: 'version'
  args:
    description: 'Raw sbobforge arguments appended verbatim (whitespace-split, each token shell-quoted). e.g. "examples/python-pytest-fixture --check --frozen" for generate.'
    required: false
    default: ''
  working-directory:
    description: 'Working directory for the command (default: the workspace root)'
    required: false
    default: ''
  dotnet-version:
    description: '.NET SDK version for actions/setup-dotnet (source mode only; default: 8.0.x)'
    required: false
    default: '8.0.x'
  nuget-auth-token:
    description: 'PAT with read:packages forwarded as NUGET_AUTH_TOKEN for the GitHub Packages feed in NuGet.config (source mode only — the pinned DevelApp.Minotaur parsing substrate restores through it; the nuget.org source restores without it). Pass secrets.GITHUB_TOKEN when this repo can read the feed. Binary mode needs no token.'
    required: false
    default: ''
  binary:
    description: 'true → run a single-file self-contained release binary instead of the .NET source (no setup-dotnet, no restore). The binary is downloaded from the SBOB-Forge release named by binary-version and verified fail-closed before it runs: cosign keyless signature against the pinned release-binaries workflow identity, then sha256 against the published checksums.'
    required: false
    default: 'false'
  binary-version:
    description: 'Release version for binary mode, v-prefix optional (e.g. "1.0.0"). Empty = latest published release. Pin it alongside the action ref for reproducible consumer CI.'
    required: false
    default: ''
  binary-dir:
    description: 'Local directory holding the release assets (sbobforge-<ver>-<platform>.tar.gz/.zip + sbobforge-<ver>-checksums.txt) instead of downloading from the release — for CI lanes that build the binaries in the same run, or air-gapped installs. Requires binary-version. (Binary mode only.)'
    required: false
    default: ''

outputs:
  exit-code:
    description: 'sbobforge exit code (propagated from the CLI); the workflow can branch on it without failing the step'
    value: ${{ steps.sbobforge.outputs.exit-code }}

runs:
  using: 'composite'
  steps:
    - name: 'Set up .NET 8 (sbobforge CLI, net8.0)'
      if: ${{ inputs.binary != 'true' }}
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ inputs.dotnet-version }}

    - name: 'Set up cosign (binary-mode signature verification, fail-closed)'
      if: ${{ inputs.binary == 'true' }}
      uses: sigstore/cosign-installer@v3

    - name: 'Install sbobforge binary (self-contained, cosign + sha256 verified)'
      if: ${{ inputs.binary == 'true' }}
      id: binary-install
      shell: bash
      env:
        SBORGFORGE_VERSION: ${{ inputs.binary-version }}
        SBORGFORGE_BINARY_DIR: ${{ inputs.binary-dir }}
      run: |
        set -euo pipefail
        bin="$(bash "${{ github.action_path }}/scripts/install-binary.sh")"
        echo "installed sbobforge binary: $bin"
        echo "binary-path=$bin" >> "$GITHUB_OUTPUT"

    - name: 'Run sbobforge'
      id: sbobforge
      shell: bash
      working-directory: ${{ inputs.working-directory != '' && inputs.working-directory || github.workspace }}
      env:
        SBOBFORGE_PROJECT: ${{ github.action_path }}/src/SBOBForge.Cli
        SBOBFORGE_BIN: ${{ steps.binary-install.outputs.binary-path }}
        SBOBFORGE_COMMAND: ${{ inputs.command }}
        SBOBFORGE_ARGS: ${{ inputs.args }}
        NUGET_AUTH_TOKEN: ${{ inputs.nuget-auth-token }}
      run: |
        set -euo pipefail

        case "$SBOBFORGE_COMMAND" in
          version|scan|generate|convert|gate) ;;
          *)
            echo "unknown command: $SBOBFORGE_COMMAND (expected version|scan|generate|convert|gate)" >&2
            exit 2
            ;;
        esac

        args=()
        # raw passthrough — each token shell-quoted, no eval, injection-safe
        for a in $SBOBFORGE_ARGS; do args+=("$a"); done

        set +e
        if [ -n "$SBOBFORGE_BIN" ]; then
          # binary mode (#27): the single-file self-contained release binary
          "$SBOBFORGE_BIN" "$SBOBFORGE_COMMAND" "${args[@]}"
          rc=$?
        else
          dotnet run --project "$SBOBFORGE_PROJECT" -- "$SBOBFORGE_COMMAND" "${args[@]}"
          rc=$?
        fi
        set -e

        echo "exit-code=$rc" >> "$GITHUB_OUTPUT"
        {
          echo "### sbobforge $SBOBFORGE_COMMAND — exit $rc"
          echo
          echo "_The full signed publish lane (convert-before-sign → cosign keyless → content gate → sbobctl validate/diff → registry PR) runs through the reusable workflow \`sbob-registry-publish.yml\` — see docs/adoption.md._"
        } >> "$GITHUB_STEP_SUMMARY"
        exit 0
